version: '3.9'

services:
  careeros-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: careeros-api
    ports:
      - "5000:5000"
    volumes:
      - careeros-data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/careeros.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - careeros-network

  careeros-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: careeros-ui
    ports:
      - "3000:80"
    depends_on:
      careeros-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - careeros-network

volumes:
  careeros-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data

networks:
  careeros-network:
    driver: bridge
